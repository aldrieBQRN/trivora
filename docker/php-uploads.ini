; Upload limits for franchise registration / MTOP renewal / evidence uploads.
; The app validates each document at max 5 MB (RegistrationController, MTOPController) and a
; submission carries 9-11 requirements, some with several files — PHP's defaults (2M per file,
; 8M per request, 20 files) rejected real submissions. Keep post_max_size in step with nginx's
; client_max_body_size (docker/nginx.conf).
upload_max_filesize = 6M
post_max_size = 60M
max_file_uploads = 50
max_input_time = 120
max_execution_time = 120
memory_limit = 256M
